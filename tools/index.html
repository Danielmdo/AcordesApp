<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>Editor Musical - AcordesApp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-header">
  <a href="../index.html">&larr; Volver</a>
  <h1>Editor Musical</h1>
  <div class="view-toggle">
    <button id="tabEdit" class="active" onclick="switchView('edit')">Editar</button>
    <button id="tabPreview" onclick="switchView('preview')">Vista</button>
  </div>
</div>

<div class="container">

  <!-- Upload + Controls -->
  <div>
    <div class="upload-area" id="dropZone">
      <div class="icon">📁</div>
      <div class="label">Arrastra o haz clic</div>
      <div class="hint">PDF · Imagen · DOCX</div>
      <div class="file-info" id="fileInfo"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.webp,.docx" style="display:none">

    <div class="control-row" style="margin-top:14px">
      <label>Raíz:</label>
      <select id="rootSelect"></select>
      <button class="primary" id="btnConvert">Grados &rarr; Notas</button>
    </div>

    <div class="control-row" style="margin-top:6px">
      <label>Transp:</label>
      <div class="transpose-group" id="transposeGroup"></div>
    </div>
  </div>

  <!-- Editor + Preview -->
  <div class="editor-container">
    <div class="action-bar">
      <div class="status" id="status">Carga un archivo para empezar</div>
      <div class="spacer"></div>
      <button id="btnExport" disabled>Exportar .txt</button>
      <button id="btnImportChordPro" title="Convertir texto plano a formato ChordPro">Importar</button>
    </div>

    <!-- Edit panel -->
    <div class="editor-panel active" id="editPanel">
      <textarea id="editor" placeholder="Escribe en formato ChordPro: [Am]Let it [C]be..."></textarea>
    </div>

    <!-- Preview panel -->
    <div class="preview-panel" id="previewPanel">
      <div id="previewContent" class="preview-empty">Cambia a vista &quot;Editar&quot; para ver el contenido</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="music-engine.js"></script>
<script>
(function() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const rootSelect = document.getElementById('rootSelect');
  const btnConvert = document.getElementById('btnConvert');
  const transposeGroup = document.getElementById('transposeGroup');
  const editor = document.getElementById('editor');
  const btnExport = document.getElementById('btnExport');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');
  const tabEdit = document.getElementById('tabEdit');
  const tabPreview = document.getElementById('tabPreview');
  const editPanel = document.getElementById('editPanel');
  const previewPanel = document.getElementById('previewPanel');
  const previewContent = document.getElementById('previewContent');
  const btnImportChordPro = document.getElementById('btnImportChordPro');

  // Populate root selector
  MusicEngine.getAvailableRoots().forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    rootSelect.appendChild(opt);
  });
  rootSelect.value = 'C';

  // Transpose buttons: -12 to +12
  for (let i = -12; i <= 12; i++) {
    const btn = document.createElement('button');
    btn.textContent = i > 0 ? '+' + i : String(i);
    btn.dataset.semitones = i;
    btn.title = i === 0 ? 'Original' : (i > 0 ? 'Subir ' : 'Bajar ') + Math.abs(i) + ' semitonos';
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => applyTranspose(i));
    transposeGroup.appendChild(btn);
  }

  // -- View switching --
  window.switchView = function(view) {
    tabEdit.classList.toggle('active', view === 'edit');
    tabPreview.classList.toggle('active', view === 'preview');
    editPanel.classList.toggle('active', view === 'edit');
    previewPanel.classList.toggle('active', view === 'preview');
    if (view === 'preview') renderPreview();
  };

  function renderPreview() {
    const text = editor.value.trim();
    if (!text) {
      previewContent.innerHTML = '<div class="preview-empty">El editor está vacío</div>';
      return;
    }
    const html = MusicEngine.renderPreview(text);
    previewContent.innerHTML = html || '<div class="preview-empty">No hay acordes para mostrar</div>';
  }

  // -- Upload handlers --
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) handleFile(files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
  });

  async function handleFile(file) {
    fileInfo.textContent = file.name;
    status.textContent = 'Procesando archivo...';
    status.className = 'status';
    btnConvert.disabled = true;
    btnExport.disabled = true;
    const ext = file.name.split('.').pop().toLowerCase();
    try {
      let rawText = '';
      if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) {
        rawText = await ocrImage(file);
      } else if (ext === 'pdf') {
        rawText = await extractPDFText(file);
      } else if (ext === 'docx') {
        rawText = await extractDocxText(file);
      } else {
        setStatus('Formato no soportado: .' + ext, 'error');
        return;
      }
      // Auto-import: detect ChordPro or convert plain text
      const chordProText = MusicEngine.importText(rawText);
      editor.value = chordProText;
      btnConvert.disabled = false;
      btnExport.disabled = false;
      const lines = editor.value.split('\n').length;
      setStatus('Listo. ' + lines + ' líneas importadas.', 'success');
    } catch (e) {
      console.error(e);
      setStatus('Error: ' + e.message, 'error');
    }
  }

  async function extractPDFText(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      let lastY = null, line = '';
      for (const item of tc.items) {
        const y = Math.round(item.transform[5]);
        if (lastY !== null && Math.abs(y - lastY) > 2) {
          fullText += line + '\n';
          line = '';
        } else if (lastY !== null && line.length > 0) {
          line += ' ';
        }
        line += item.str;
        lastY = y;
      }
      if (line) fullText += line + '\n';
      fullText += '\n';
    }
    return fullText.trim();
  }

  async function extractDocxText(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    const div = document.createElement('div');
    div.innerHTML = result.value;
    return (div.textContent || div.innerText || '').trim();
  }

  async function ocrImage(file) {
    const imgUrl = URL.createObjectURL(file);
    try {
      const { data } = await Tesseract.recognize(imgUrl, 'spa+eng', {
        logger: (m) => {
          if (m.status === 'recognizing text') {
            status.textContent = 'OCR: ' + Math.round(m.progress * 100) + '%';
          }
        }
      });
      return data.text.trim();
    } finally {
      URL.revokeObjectURL(imgUrl);
    }
  }

  // -- Convert degrees (only within [brackets]) --
  btnConvert.addEventListener('click', () => {
    const root = rootSelect.value;
    const before = editor.value;
    const after = MusicEngine.convertDegrees(before, root);
    if (before !== after) {
      const changes = countDiffs(before, after);
      editor.value = after;
      setStatus(changes + ' acorde' + (changes !== 1 ? 's' : '') + ' convertido' + (changes !== 1 ? 's' : '') + ' (raíz ' + root + ')', 'success');
    } else {
      setStatus('No se detectaron grados para convertir', '');
    }
  });

  function countDiffs(before, after) {
    const b = before.split('\n');
    const a = after.split('\n');
    let n = 0;
    for (let i = 0; i < Math.min(b.length, a.length); i++) {
      if (b[i] !== a[i]) n++;
    }
    return n;
  }

  // -- Transpose (only within [brackets]) --
  function applyTranspose(semitones) {
    const text = editor.value;
    if (!text.trim()) return;

    const transposed = MusicEngine.transpose(text, semitones);
    editor.value = transposed;
    transposeGroup.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', parseInt(b.dataset.semitones) === semitones)
    );
    const label = semitones === 0 ? 'Original' : (semitones > 0 ? '+' + semitones : String(semitones));
    setStatus('Transpuesto ' + label + ' semitonos', 'success');
  }

  // -- Import plain text as ChordPro --
  btnImportChordPro.addEventListener('click', () => {
    const text = editor.value;
    if (!text.trim()) return;
    if (MusicEngine.isChordPro(text)) {
      setStatus('Ya está en formato ChordPro', '');
      return;
    }
    const converted = MusicEngine.importText(text);
    if (converted !== text) {
      editor.value = converted;
      setStatus('Convertido a ChordPro', 'success');
    } else {
      setStatus('No se pudo convertir (¿no hay acordes detectados?)', '');
    }
  });

  // -- Export --
  btnExport.addEventListener('click', () => {
    const text = editor.value;
    if (!text.trim()) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'letra_acordes.txt';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exportado como letra_acordes.txt');
  });

  // -- Utils --
  function setStatus(msg, type) {
    status.textContent = msg;
    status.className = 'status' + (type ? ' ' + type : '');
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Re-render preview on edit
  editor.addEventListener('input', () => {
    if (previewPanel.classList.contains('active')) renderPreview();
  });
})();
</script>
</body>
</html>
