<!DOCTYPE html>
<html>
<head><title>Generar Iconos</title></head>
<body>
  <p>Generando iconos...</p>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const s = size;
      
      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, s * 0.15);
      ctx.fill();
      
      // Document
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      const docPad = s * 0.2;
      const docW = s * 0.55;
      const docH = s * 0.72;
      ctx.beginPath();
      ctx.roundRect(docPad, s * 0.14, docW, docH, s * 0.03);
      ctx.fill();
      
      // Lines
      const line1 = s * 0.38;
      const lineH = s * 0.025;
      ctx.fillStyle = '#4a6cf7';
      ctx.beginPath();
      ctx.roundRect(s * 0.28, line1, docW * 0.78, lineH, lineH/2);
      ctx.fill();
      
      ctx.fillStyle = '#ddd';
      for (let i = 0; i < 4; i++) {
        const y = line1 + s * 0.08 + i * s * 0.06;
        ctx.beginPath();
        ctx.roundRect(s * 0.28, y, docW * (i % 2 === 0 ? 0.66 : 0.5), lineH, lineH/2);
        ctx.fill();
      }
      
      ctx.fillStyle = '#4a6cf7';
      ctx.beginPath();
      ctx.roundRect(s * 0.28, line1 + s * 0.32, docW * 0.78, lineH, lineH/2);
      ctx.fill();
      
      for (let i = 0; i < 3; i++) {
        const y = line1 + s * 0.40 + i * s * 0.06;
        ctx.fillStyle = '#ddd';
        ctx.beginPath();
        ctx.roundRect(s * 0.28, y, docW * 0.52, lineH, lineH/2);
        ctx.fill();
      }
      
      // Download
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.textContent = `Descargar icon-${size}.png`;
      document.body.appendChild(link);
      document.body.appendChild(document.createElement('br'));
    }
    
    drawIcon(document.getElementById('canvas192'), 192);
    drawIcon(document.getElementById('canvas512'), 512);
    
    document.body.innerHTML += '<p>✅ Iconos generados. Haz clic derecho > Guardar como en cada imagen, o usa los links de descarga.</p>';
    document.body.innerHTML += '<p>Guarda los archivos como <b>icon-192.png</b> y <b>icon-512.png</b> en la carpeta <b>icons/</b></p>';
  </script>
</body>
</html>
