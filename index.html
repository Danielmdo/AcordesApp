<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AcordesApp">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>AcordesApp - Visor de Documentos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Session List Screen ===== -->
  <div id="sessionListScreen" class="screen active">
    <div class="screen-header">
      <h1 class="app-title">AcordesApp</h1>
      <p class="app-subtitle">Visor inteligente de documentos</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon-wrapper">📂</div>
      <h2 class="empty-title">No hay sesiones</h2>
      <p class="empty-text">Crea una sesión para organizar tus PDFs, imágenes y documentos Word</p>
      <button class="btn btn-primary" onclick="showCreateModal()">+ Nueva Sesión</button>
    </div>

    <!-- Session List -->
    <div id="sessionList" class="session-list"></div>

    <!-- FAB -->
    <div class="fab-container">
      <button class="fab" onclick="showCreateModal()" id="fabAdd" aria-label="Nueva sesión">+</button>
    </div>
  </div>

  <!-- ===== Session Viewer Screen ===== -->
  <div id="sessionViewerScreen" class="screen">
    <!-- Header -->
    <div class="viewer-header">
      <button class="btn-back" onclick="goBackToSessions()" id="btnBack" aria-label="Volver">‹</button>
      <div class="viewer-header-center">
        <span id="viewerSessionName" class="viewer-session-name"></span>
        <span id="viewerFileName" class="viewer-file-name">Selecciona un archivo</span>
      </div>
      <button class="btn-add-file" onclick="pickFiles()" aria-label="Agregar archivo">+</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Pager -->
    <div class="pager-container" id="pagerContainer">
      <div class="pager" id="pager"></div>
    </div>

    <!-- Empty Viewer -->
    <div class="empty-viewer" id="emptyViewer">
      <div class="empty-viewer-icon">📄</div>
      <p class="empty-viewer-text">Aún no hay archivos en esta sesión</p>
      <button class="btn btn-primary" onclick="pickFiles()">Agregar Archivos</button>
    </div>

    <!-- Navigation Arrows -->
    <button class="nav-arrow nav-left" id="navLeft" onclick="navigatePage(-1)" aria-label="Anterior">‹</button>
    <button class="nav-arrow nav-right" id="navRight" onclick="navigatePage(1)" aria-label="Siguiente">›</button>

    <!-- Page Indicator -->
    <div class="page-indicator" id="pageIndicator"></div>
  </div>

  <!-- ===== Create Session Modal ===== -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Nueva Sesión</h2>
      <p class="modal-text">Ingresa un nombre para organizar tus documentos</p>
      <input
        type="text"
        class="modal-input"
        id="sessionNameInput"
        placeholder="Ej: Proyecto, Viaje, Recetas..."
        maxlength="50"
        autofocus
        enterkeyhint="done"
      >
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="hideCreateModal()">Cancelar</button>
        <button class="btn btn-primary" id="btnCreateSession" onclick="handleCreateSession()">Crear</button>
      </div>
    </div>
  </div>

  <!-- ===== Hidden File Input ===== -->
  <input
    type="file"
    id="fileInput"
    multiple
    accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.webp,.docx,.doc"
    style="display:none"
  >

  <!-- ===== Loading Overlay ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText">Procesando archivos...</p>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== Scripts ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.0/mammoth.browser.min.js"></script>
  <script src="sessionManager.js"></script>
  <script src="fileProcessor.js"></script>
  <script src="pageRenderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
